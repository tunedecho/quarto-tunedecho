<!-- @dsCard height=320 -->
<!doctype html>
<html><head><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;background:var(--bg)}
.cover{position:relative;width:960px;height:320px;background:var(--bg);overflow:hidden}
.band{position:absolute;left:0;top:0;width:960px;height:112px;display:block}
.pink{fill:var(--key-pink)} .yellow{fill:var(--key-yellow)} .green{fill:var(--key-green)} .blue{fill:var(--key-blue)} .slab{fill:var(--ink)}
.pill{fill:var(--bg)}
.text{position:absolute;left:40px;bottom:28px;max-width:440px}
.name{font-family:var(--font-serif);font-weight:400;font-size:120px;line-height:.95;letter-spacing:-.015em;color:var(--ink);margin:0;white-space:nowrap}
.name em{font-style:italic}
.tag{font-family:var(--font-sans);font-size:14px;line-height:1.4;color:var(--muted);margin:8px 0 0}
</style></head>
<body>
<div class="cover">
  <svg class="band" viewBox="0 0 960 112" aria-hidden="true">
    <!--
      blocks: key-pink 192, key-yellow 96, key-green 288, key-blue 128, ink 256 wide (multiples of space-8/space-16), all 112 tall, radius-0
      arrangement: a strip of unequal bands across the top, the way the brand runs its seven bars under the wordmark and along the foot of every printed page
      pattern: pills from radius-pill, three rows of seven cut in bg from the ink slab, because the seven pill bars are the brand's one ornament and the rows echo it
      steps and radii: pill 28x8 with rx 4 (half the short side), gap 6.4 (the te-rule gap), rows 16 apart (space-4), radius-0 blocks
    -->
    <rect class="pink" x="0" y="0" width="192" height="112"/>
    <rect class="yellow" x="192" y="0" width="96" height="112"/>
    <rect class="green" x="288" y="0" width="288" height="112"/>
    <rect class="blue" x="576" y="0" width="128" height="112"/>
    <rect class="slab" x="704" y="0" width="256" height="112"/>
    <g class="pill">
      <rect x="716" y="40" width="28" height="8" rx="4"/><rect x="750.4" y="40" width="28" height="8" rx="4"/><rect x="784.8" y="40" width="28" height="8" rx="4"/><rect x="819.2" y="40" width="28" height="8" rx="4"/><rect x="853.6" y="40" width="28" height="8" rx="4"/><rect x="888" y="40" width="28" height="8" rx="4"/><rect x="922.4" y="40" width="28" height="8" rx="4"/>
      <rect x="716" y="56" width="28" height="8" rx="4"/><rect x="750.4" y="56" width="28" height="8" rx="4"/><rect x="784.8" y="56" width="28" height="8" rx="4"/><rect x="819.2" y="56" width="28" height="8" rx="4"/><rect x="853.6" y="56" width="28" height="8" rx="4"/><rect x="888" y="56" width="28" height="8" rx="4"/><rect x="922.4" y="56" width="28" height="8" rx="4"/>
      <rect x="716" y="72" width="28" height="8" rx="4"/><rect x="750.4" y="72" width="28" height="8" rx="4"/><rect x="784.8" y="72" width="28" height="8" rx="4"/><rect x="819.2" y="72" width="28" height="8" rx="4"/><rect x="853.6" y="72" width="28" height="8" rx="4"/><rect x="888" y="72" width="28" height="8" rx="4"/><rect x="922.4" y="72" width="28" height="8" rx="4"/>
    </g>
  </svg>
  <div class="text">
    <h1 class="name">Tuned <em>Echo</em></h1>
    <p class="tag">Tuning your systems to echo your mission</p>
  </div>
</div>
<script></script>
</body></html>
